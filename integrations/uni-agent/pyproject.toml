[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-agent-substrate"
version = "0.1.0"
description = "uni-agent sandbox provider and SWE tasks backed by Agent Substrate environments (via ate-env-api)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "ate-env-rl",   # clients/python of this repository (pip install ./clients/python)
  "pydantic>=2",
  # uni-agent itself is not on PyPI: install git+https://github.com/verl-project/uni-agent@174b040
  # with --no-deps first (see README); it is deliberately not declared here.
]

[project.optional-dependencies]
datasets = ["datasets", "pyarrow", "huggingface_hub"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "grpcio>=1.85.1", "protobuf>=7.35"]

[project.scripts]
uni-agent-substrate-datasets = "uni_agent_substrate.datasets:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]  # same set as clients/python

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
# uni-agent at the pinned commit plus the dependencies its CI installs next to
# it (its pyproject.toml declares none). A dependency group, not a dependency:
# groups are not published, and a git URL can't be in published metadata.
# Upstream declares requires-python <3.13, hence the marker; the tests run on
# 3.12.
uni-agent = [
  "uni-agent; python_version < '3.13'",
  "pyyaml",
  "httpx",
  "jsonschema",
  "openai",
]

[tool.uv.sources]
ate-env-rl = { workspace = true }
uni-agent = { git = "https://github.com/verl-project/uni-agent", rev = "174b040e541f70234a22930a3f2ff8d1e2be5399" }
