[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ate-env-harbor"
version = "0.1.0"
description = "Harbor environment provider on Agent Substrate environments (ate-env)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"  # what harbor requires
# ate-env-rl is this repo's Python client (clients/python); if not yet on
# PyPI, install it from the checkout first: pip install ./clients/python
# harbor releases often; it is pinned to one minor and bumped deliberately,
# with tests/test_trial.py (Harbor's own trial runner on this provider) as
# the gate.
dependencies = [
  "ate-env-rl",
  "harbor>=0.25,<0.26",
  "dockerfile-parse>=2.0.1",  # harbor's Dockerfile WORKDIR parser imports it lazily
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1.4.1.post1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ate-env-rl = { workspace = true }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# The same rules as clients/python.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
