# Checks for pull requests and main: Go build, vet, test, protos, license
# headers, Markdown formatting and the generated docs/metrics.md; Python
# client (base install and telemetry extras), telemetry report tool and
# integration tests; the OpenHands integration; release builds and
# distributions; the Dafny models in docs/plans/telemetry/verify; and Kind
# E2E smoke tests. Release publishing lives in release.yaml. Actions are
# pinned by commit SHA (version in the trailing comment), as the
# organization's workflow security scan requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Required status check on main (or planned); renaming requires a matching ruleset update.
  go:
    name: Go build, vet, test and license headers
    runs-on: ubuntu-24.04 # pinned on purpose: ubuntu-latest now resolves to 26.04; bump deliberately
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/cache-go-and-substrate
        with:
          mode: restore
          scope: go
      - name: Run Go CI checks via Nix
        shell: nix develop -c bash -eo pipefail {0}
        run: ci-go
      - uses: ./.github/actions/cache-go-and-substrate
        with:
          mode: save
          scope: go
      - name: Upload Go coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage/
          if-no-files-found: ignore

  # Required status check on main (or planned); renaming requires a matching ruleset update.
  python:
    name: Python client and integration tests
    runs-on: ubuntu-24.04 # pinned on purpose: ubuntu-latest now resolves to 26.04; bump deliberately
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Python CI checks via Nix
        shell: nix develop -c bash -eo pipefail {0}
        run: ci-python
      - name: Upload Python coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage/
          if-no-files-found: ignore

  # Required status check on main (or planned); renaming requires a matching ruleset update.
  e2e-kind:
    name: E2E Kind and Smoke Test
    runs-on: ubuntu-24.04 # pinned on purpose: ubuntu-latest now resolves to 26.04; bump deliberately
    timeout-minutes: 30
    steps:
      # The root disk of the hosted runner fills while `ate-setup --kind deploy`
      # builds the envoy-dataplane image (a rust:bookworm builder stage) next
      # to the Nix store, the Go caches and the Kind node image: the job failed
      # with "no space left on device" on every run from 2026-11-11 17:55Z on,
      # with the runner image, the caches and the base images unchanged. The
      # toolchains removed here are preinstalled on the runner and not used:
      # the job takes its tools from Nix. `df` before and after puts the free
      # space in the log, which had no trace of it.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # A separate scope from the Go job: ko's build flags differ, so the two
      # caches don't share entries (see the action for details).
      - uses: ./.github/actions/cache-go-and-substrate
        with:
          mode: restore
          scope: e2e
      - name: Run E2E Kind and Smoke Test via Nix
        shell: nix develop -c bash -eo pipefail {0}
        run: ci-e2e
      - uses: ./.github/actions/cache-go-and-substrate
        with:
          mode: save
          scope: e2e

  # Required status check on main (or planned); renaming requires a matching ruleset update.
  openhands:
    # A job of its own: openhands-sdk and the agent-server the tests start pull
    # in a large dependency set that the other Python checks do not need. It runs
    # in the .#openhands devShell, whose env nix/python.nix builds from uv.lock.
    name: OpenHands integration
    runs-on: ubuntu-24.04 # pinned on purpose: ubuntu-latest now resolves to 26.04; bump deliberately
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run OpenHands tests and ruff
        shell: nix develop .#openhands -c bash -eo pipefail {0}
        run: |
          python -m pytest integrations/openhands/tests -q
          ruff check integrations/openhands examples/openhands

  harbor:
    # Its own job: harbor pulls a large dependency set, and the trial test
    # starts containers through the runner's docker daemon. It runs in the
    # .#harbor devShell via pip venv, like the OpenHands job: harbor is pinned
    # to one minor in integrations/harbor/pyproject.toml and is not in nixpkgs.
    name: Harbor integration
    runs-on: ubuntu-24.04 # pinned on purpose: ubuntu-latest now resolves to 26.04; bump deliberately
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Harbor tests and ruff
        shell: nix develop .#harbor -c bash -eo pipefail {0}
        run: |
          python -m pytest integrations/harbor/tests -q
          ruff check integrations/harbor

  dafny:
    # The hand-written Dafny models of the telemetry and warm-pool code
    # (docs/plans/telemetry/verify). Some lemmas fail by design, so the check
    # compares the results with the README's counts and failing lemmas
    # instead of requiring a clean run. A job of its own: the .#dafny devShell
    # brings the .NET SDK and Z3, which no other check needs.
    name: Dafny models
    runs-on: ubuntu-24.04 # pinned on purpose: ubuntu-latest now resolves to 26.04; bump deliberately
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the Dafny models against their README
        shell: nix develop .#dafny -c bash -eo pipefail {0}
        run: |
          dafny --version
          python3 hack/verify/dafny.py

  validate-release:
    name: Validate release builds and distributions
    runs-on: ubuntu-24.04 # pinned on purpose: ubuntu-latest now resolves to 26.04; bump deliberately
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/cache-go-and-substrate
        with:
          mode: restore
          scope: go
      - name: Validate release builds and distributions via Nix
        shell: nix develop -c bash -eo pipefail {0}
        run: ci-release
