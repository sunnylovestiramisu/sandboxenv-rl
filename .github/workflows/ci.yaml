# Checks for pull requests and main: the Go build, vet and tests, gofmt, the
# license headers, the freshness of the generated docs/metrics.md, and the
# Python tests, once on the base install and once with the telemetry extras
# (tracing, metrics), so both the no-op fallbacks and the real exporters are
# exercised. Release publishing lives in
# release.yaml. Actions are pinned by commit SHA (version in the trailing
# comment), as the organization's workflow security scan requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or pull request supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet, test, license headers and generated docs
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: make verify-gofmt
      - run: hack/verify/boilerplate.sh
      - name: docs/metrics.md is generated from internal/telemetry
        run: go run ./hack/metrics-docs > /tmp/metrics.md && diff -u docs/metrics.md /tmp/metrics.md

  python:
    name: Python client and integration tests (${{ matrix.extras }})
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; bump deliberately
    strategy:
      fail-fast: false
      matrix:
        # dev alone is the base install (no OpenTelemetry, no prometheus-client).
        extras: ["dev", "dev,tracing,metrics"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e "clients/python[${EXTRAS}]" -e 'integrations/nemo-gym[test]'
        env:
          EXTRAS: ${{ matrix.extras }}
      - run: python -m pytest clients/python/tests -q
      - run: python -m pytest internal/benchmarking/swebench/trajectories -q
      - run: python -m pytest benchmarking/swebench -q
      - run: ruff check clients/python
      - run: python -m pytest integrations/nemo-gym/tests -q
      - run: python -m pytest benchmarking/telemetry_report -q
      - run: ruff check benchmarking/telemetry_report
      # Again with the tracing extra: the whole client suite, so the span and
      # traceparent tests run instead of skipping, and the instrumented code
      # paths are tested with OpenTelemetry installed.
      - run: python -m pip install -e 'clients/python[dev,tracing]'
      - run: python -m pytest clients/python/tests -q
