# Dependabot: weekly, grouped, one PR per ecosystem. The Substrate module is
# kept out of the Go group on purpose: its bumps change the API the manifests
# and the client are generated from and go through the bump procedure, not
# through an automated PR. The entries cover the supported components
# (docs/support.md): the Go module, the Python projects (one uv workspace and
# uv.lock at the root: clients/python and the integrations) and the GitHub
# Actions. examples/ is not supported and has no entry.
#
# Keep docs/chores/check-pins.md in sync: its pin inventory and "When
# Dependabot opens a PR" section describe which ecosystems, directories and
# ignored dependencies this file covers. If you add, remove or ignore anything
# here, update that doc in the same change. Substrate bumps are described in
# docs/chores/check-substrate-head.md.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # a release has to be a week old before it is proposed
    labels: [dependencies]
    groups:
      go-deps:
        patterns: ["*"]
        exclude-patterns: ["go.ate.dev/substrate"]
    ignore:
      - dependency-name: go.ate.dev/substrate
  # uv.lock, which the Nix devShell's Python envs are built from (nix/python.nix).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # a release has to be a week old before it is proposed
    labels: [dependencies]
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # Pinned to the agent-server in integrations/openhands/layer/requirements.in;
      # the SDK and the server it talks to move together, by hand.
      - dependency-name: "openhands-*"
      # A git source pinned by commit in integrations/uni-agent/pyproject.toml.
      # Dependabot would look it up on PyPI instead
      # (https://github.com/dependabot/dependabot-core/issues/16129).
      - dependency-name: uni-agent
      # Generates the committed Python stubs, which require a grpcio at least
      # as new as the generator; it moves with the client's grpcio floor and a
      # `make protos`, by hand.
      - dependency-name: grpcio-tools
      # A build-system floor in clients/python/pyproject.toml, not a pin. The
      # release build (hack/release/build-dists.sh, `--no-isolation`) takes
      # setuptools-scm from nixpkgs (nix/ci.nix, pythonReleaseTools), so a
      # floor above the nixpkgs version fails release validation and
      # publish-pypi (#284). Raise it by hand, after the flake.lock bump that
      # brings a newer one.
      - dependency-name: setuptools-scm
  - package-ecosystem: github-actions
    # The workflows, plus the local composite actions under .github/actions,
    # which pin actions of their own.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # a release has to be a week old before it is proposed
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker # the OpenHands layer's digest-pinned base images
    directory: /integrations/openhands/layer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # a release has to be a week old before it is proposed
    labels: [dependencies]
    groups:
      openhands-layer-images:
        patterns: ["*"]
  # flake.lock pins the toolchain CI runs (Go, the Python interpreters, uv,
  # ko, kind, kubectl; the Python packages come from uv.lock; buf and the
  # protobuf generators are go.mod tool lines, bumped by the gomod entry). A
  # bump here is checked by ci-devenv.yaml, which fails with fix instructions
  # if nixpkgs drifts from go.mod.
  - package-ecosystem: nix
    directory: /
    schedule:
      # Every two weeks (1st and 15th) rather than weekly, while flake.nix
      # follows nixos-unstable: fewer toolchain churn PRs.
      interval: cron
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 7 # a release has to be a week old before it is proposed
    labels: [dependencies]
    groups:
      flake-inputs:
        patterns: ["*"]
