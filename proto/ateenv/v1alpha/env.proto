// Protocol Buffers definition for the Agent Substrate Environment Control Plane API.
// Exposes environment lifecycle operations (create, get, suspend, delete).

syntax = "proto3";

package ateenv.v1alpha;

option go_package = "github.com/agent-substrate/env/proto/ateenv/v1alpha;ateenvv1alpha";

import "google/protobuf/duration.proto";


// TODO(jbd): Add ListEnvironments to EnvironmentService.

// ============================================================================
// --- SERVICES ---
// ============================================================================

// EnvironmentService manages the lifecycle of isolated execution environments.
service EnvironmentService {
  // CreateEnvironment registers and starts a new environment from an actor template.
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);

  // GetEnvironment retrieves the status and configuration of an existing environment.
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);

  // SuspendEnvironment checkpoints and stops an active environment. The
  // request's mode says whether the call returns once the snapshot is in
  // object storage (the default) or once it is on the node.
  rpc SuspendEnvironment(SuspendEnvironmentRequest) returns (SuspendEnvironmentResponse);

  // DeleteEnvironment permanently removes an environment and its associated resources.
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse);

  // GetServerInfo reports which server implementation answers, its version, and
  // the optional features it serves, so a client can check them before it
  // depends on them.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);

  // Report the ActorTemplate derived for a rootfs image: whether it exists
  // and whether its golden snapshot is ready, still baking, or failed. Reads
  // only; a missing template is reported, not created.
  rpc GetImageStatus(GetImageStatusRequest) returns (ImageStatus);

  // Create the ActorTemplate derived for a rootfs image when it is missing,
  // which starts its golden snapshot bake, and report it as GetImageStatus
  // does. No environment is created. A template whose golden bake failed is
  // recreated the way CreateEnvironment would.
  rpc EnsureImageTemplate(EnsureImageTemplateRequest) returns (ImageStatus);

  // ListPlacementDomains reports the worker pools a caller can address with a
  // per-environment worker selector: for each pool, the labels all its
  // schedulable workers carry (the selector), its distinct nodes and the
  // slots per node. With a template, only the pools that template's own
  // worker_selector matches. Read from Substrate's workers, which takes the
  // global viewer role (see `ate-env manifest access-policy --global`);
  // PermissionDenied otherwise, template or not.
  rpc ListPlacementDomains(ListPlacementDomainsRequest) returns (ListPlacementDomainsResponse);

  // WarmImage puts one rootfs image on every node of one placement domain, so
  // the first environment of that image on each node boots from the node's
  // cache: it creates probe environments with the worker selector, resumes
  // them (a new environment is suspended until a resume places it), holds
  // them until the control plane reports them RUNNING (the layers and the
  // golden snapshot are on the node by then), reads each node from the actor
  // status, deletes the probes, and repeats until every node ran the image or
  // the rounds run out. It streams a probe event per probe and ends with the
  // coverage. No command runs in the guest. A probe name that exists already
  // is reported as a failed create and left alone. Wait for the image's
  // golden (GetImageStatus) first when the run relies on it.
  rpc WarmImage(WarmImageRequest) returns (stream WarmImageEvent);
}

// ============================================================================
// --- TYPES & ENUMS ---
// ============================================================================

// Lifecycle status of an environment, matching Substrate actor statuses.
enum EnvironmentStatus {
  ENVIRONMENT_STATUS_UNSPECIFIED = 0;
  // Environment is resuming / warming up from snapshot.
  ENVIRONMENT_STATUS_RESUMING = 1;
  // Environment is active and ready to accept operations.
  ENVIRONMENT_STATUS_RUNNING = 2;
  // Environment is in the process of suspending.
  ENVIRONMENT_STATUS_SUSPENDING = 3;
  // Environment is suspended and checkpointed.
  ENVIRONMENT_STATUS_SUSPENDED = 4;
  // Environment is in the process of pausing. Not produced: Substrate
  // reports one SUSPENDING state whatever the suspend mode.
  ENVIRONMENT_STATUS_PAUSING = 5;
  // Environment is paused: suspended with SUSPEND_MODE_LOCAL, its snapshot
  // on its node and the upload to object storage not landed yet. It resumes
  // on that node; once the upload lands it is SUSPENDED like any other.
  ENVIRONMENT_STATUS_PAUSED = 6;
  // Environment process crashed.
  ENVIRONMENT_STATUS_CRASHED = 7;
  // Environment is being deleted.
  ENVIRONMENT_STATUS_DELETING = 8;
}

// How SuspendEnvironment treats the snapshot before it returns. The mode
// applies when the call checkpoints a running environment. On an environment
// that is already SUSPENDED, or PAUSED with its upload still pending,
// Substrate's SuspendActor returns at once and the call changes nothing: a
// DURABLE request on a PAUSED environment does not wait for the upload.
enum SuspendMode {
  // Unset: SUSPEND_MODE_DURABLE, what ate-env always did.
  SUSPEND_MODE_UNSPECIFIED = 0;
  // Return once the snapshot is in object storage. The environment survives
  // the loss of its node and resumes on any node.
  SUSPEND_MODE_DURABLE = 1;
  // Return once the snapshot is on the worker's node; the upload to object
  // storage goes on in the background. Until it lands the environment
  // resumes on that node only, reports ENVIRONMENT_STATUS_PAUSED, and a node
  // lost before then takes the snapshot with it. One park-and-resume cycle is
  // cheaper this way, which is what a loop that parks an environment between
  // every command wants.
  SUSPEND_MODE_LOCAL = 2;
}

// Template represents an ActorTemplate used to instantiate environments.
message Template {
  // Name of the ActorTemplate (e.g. "default-template").
  string name = 1;
  // Substrate atespace where the ActorTemplate is located.
  string atespace = 2;
}

// Environment represents an isolated execution environment backed by a Substrate actor.
message Environment {
  // Unique environment identifier (DNS-1123 label).
  string id = 1;
  // Substrate atespace where the environment actor lives.
  string atespace = 2;
  // ActorTemplate configuration the environment is instantiated from.
  Template template = 3;
  // Current lifecycle status of the environment.
  EnvironmentStatus status = 4;
  // Kubernetes node hosting the environment's actor, or its local snapshot
  // while it is suspended. Substrate's Actor.status.assigned_node, which a
  // detach or revert clears, else the worker assignment's node, which
  // Substrate unsets whenever the actor has no worker; empty when both are
  // clear: before the first placement, and after a detach.
  string node = 5;
  // The per-environment worker selector the environment was created with
  // (CreateEnvironmentRequest.worker_selector); empty when none was given.
  map<string, string> worker_selector = 6;
}

// ============================================================================
// --- ENVIRONMENT SERVICE MESSAGES ---
// ============================================================================

// Request to create and start a new environment.
message CreateEnvironmentRequest {
  // Unique environment identifier (DNS-1123 label). Required.
  string id = 1;
  // Substrate atespace for the environment (defaults to "ate-env").
  string atespace = 2;
  // ActorTemplate configuration to instantiate (defaults to name "default-template" in atespace "ate-env").
  Template template = 3;
  // Rootfs image to run, pinned by digest (repo@sha256:...). Optional. When
  // set, the environment is created from an ActorTemplate derived from
  // `template`, which acts as the base: its worker selector, snapshot,
  // sandbox and resource settings are kept, its container image is replaced
  // by the rootfs image, and the ate-env-guest from the base is mounted into
  // it as a read-only image volume (a runtime layer, not part of the task
  // image), so the rootfs image runs unmodified. The derived template is named
  // "<base>-<first 12 hex digits of the digest>" in the base's atespace; it
  // is created on first use and reused afterwards, and the response reports
  // it.
  string rootfs_image = 4;
  // Labels the worker pool that runs this environment must carry, matched by
  // exact equality. Optional. Substrate ANDs it with the template's own
  // worker selector, thus it narrows the template's pools and never widens
  // them; an empty map keeps the template's selection. It is set on the
  // actor as Actor.worker_selector, which also applies to its later wakes.
  map<string, string> worker_selector = 5;
}

// Response returned after creating an environment.
message CreateEnvironmentResponse {
  // The created environment.
  Environment environment = 1;
}

// State of a derived template's golden snapshot, the snapshot every
// environment on the image restores from instead of booting.
enum GoldenSnapshotState {
  GOLDEN_SNAPSHOT_STATE_UNSPECIFIED = 0;
  // No golden snapshot will come: the derived template does not exist, or
  // its golden snapshots are disabled (golden_snapshot_config.mode).
  GOLDEN_SNAPSHOT_STATE_NONE = 1;
  // The template exists and its golden snapshot is baking; environments
  // created now boot from the image.
  GOLDEN_SNAPSHOT_STATE_PENDING = 2;
  // The golden snapshot is tagged; environments restore from it.
  GOLDEN_SNAPSHOT_STATE_READY = 3;
  // The bake failed and will not be retried on this template
  // (golden_error says why); environments boot from the image until the
  // template is recreated.
  GOLDEN_SNAPSHOT_STATE_FAILED = 4;
}

// Request for the state of the template derived for a rootfs image.
message GetImageStatusRequest {
  // Rootfs image, pinned by digest (repo@sha256:...). Required.
  string rootfs_image = 1;
  // Base ActorTemplate the derived template comes from; defaults as in
  // CreateEnvironmentRequest.template.
  Template template = 2;
  // Atespace of the templates (defaults as in CreateEnvironmentRequest).
  string atespace = 3;
}

// Request to create the template derived for a rootfs image when missing.
message EnsureImageTemplateRequest {
  // Rootfs image, pinned by digest (repo@sha256:...). Required.
  string rootfs_image = 1;
  // Base ActorTemplate the derived template comes from; defaults as in
  // CreateEnvironmentRequest.template.
  Template template = 2;
  // Atespace of the templates (defaults as in CreateEnvironmentRequest).
  string atespace = 3;
}

// The template derived for a rootfs image and the state of its golden
// snapshot.
message ImageStatus {
  // The rootfs image asked about.
  string rootfs_image = 1;
  // The derived template: "<base>-<first 12 hex digits of the digest>" in
  // the base's atespace, whether or not it exists yet.
  Template template = 2;
  // Whether the derived template exists.
  bool template_exists = 3;
  // State of the golden snapshot.
  GoldenSnapshotState golden = 4;
  // Name of the golden tag when golden is READY.
  string golden_tag = 5;
  // Why the bake failed when golden is FAILED ("<Reason>: <detail>").
  string golden_error = 6;
}

// Request to inspect an environment.
message GetEnvironmentRequest {
  // Unique identifier of the environment to retrieve. Required.
  string id = 1;
  // Substrate atespace of the environment (defaults to "ate-env").
  string atespace = 2;
}

// Response containing environment details.
message GetEnvironmentResponse {
  // The requested environment.
  Environment environment = 1;
}

// Request to suspend an environment.
message SuspendEnvironmentRequest {
  // Unique identifier of the environment to suspend. Required.
  string id = 1;
  // Substrate atespace of the environment (defaults to "ate-env").
  string atespace = 2;
  // How the suspend treats the snapshot; unset means SUSPEND_MODE_DURABLE.
  // An ate-env-api that predates this field refuses a request that sets it
  // (INVALID_ARGUMENT), because it rejects fields it does not know; a durable
  // suspend leaves it unset and works against either. GetServerInfo lists
  // "suspend_mode" once the server serves it.
  SuspendMode mode = 3;
}

// Response returned after suspending an environment.
message SuspendEnvironmentResponse {}

// Request to delete an environment.
message DeleteEnvironmentRequest {
  // Unique identifier of the environment to delete. Required.
  string id = 1;
  // Substrate atespace of the environment (defaults to "ate-env").
  string atespace = 2;
}

// Response returned after deleting an environment.
message DeleteEnvironmentResponse {}

// Request for the server's identity and features.
message GetServerInfoRequest {}

// Identity, version and optional features of the server.
message GetServerInfoResponse {
  // Server implementation, "sandboxenv-rl" for this repository's ate-env-api.
  string server = 1;
  // Build version of the server: the release tag; for a build from a git
  // checkout, the Go pseudo-version (vX.Y.Z-0.<UTC time>-<12 hex digits of
  // the commit>, with "+dirty" for uncommitted changes); "dev" when the build
  // has no version information.
  string version = 2;
  // Version of the go.ate.dev/substrate module the server binary was built
  // against, or "unknown". This is not the version of the Substrate control
  // plane the server talks to: the two can differ, and Substrate has no RPC
  // that reports its version. "+replaced" marks a local replacement of the
  // module, whose version the binary does not record.
  string substrate_version = 3;
  // Optional features the server serves, e.g. "rootfs_image", "pty",
  // "suspend_mode", "port_proxy". Clients must ignore names they do not know.
  // A name keeps its meaning once published.
  repeated string features = 4;
}

// Request for the placement domains: all of them, or the ones a template can
// address.
message ListPlacementDomainsRequest {
  // Base ActorTemplate whose pools to report; defaults as in
  // CreateEnvironmentRequest.template when atespace is set, unset means no
  // filter. With a template, only the pools whose selector carries every
  // label of the template's own worker_selector are reported (the pools a
  // worker_selector for that template can address), and a pool whose workers
  // share no label is dropped, as no selector addresses it. NotFound when
  // the template does not exist.
  Template template = 1;
  // Atespace of the template (defaults as in CreateEnvironmentRequest).
  string atespace = 2;
}

// One placement domain: a worker pool, as a per-environment worker selector
// addresses it.
message PlacementDomain {
  // The WorkerPool's name.
  string name = 1;
  // Kubernetes namespace of the pool.
  string worker_namespace = 2;
  // Labels every schedulable worker of the pool carries; a worker_selector
  // equal to them keeps an environment in the pool. Empty when the workers
  // share no label, which no selector can address.
  map<string, string> selector = 3;
  // Distinct nodes of the pool's schedulable workers: active, with an actor
  // capacity (a worker that has registered but not reported its capacity
  // yet gets nothing placed on it and does not count).
  int32 nodes = 4;
  // Schedulable workers of the pool.
  int32 workers = 5;
  // Environments one node runs at once: the smallest actor capacity of the
  // pool's schedulable workers.
  int32 node_slots = 6;
}

// The placement domains, sorted by name.
message ListPlacementDomainsResponse {
  repeated PlacementDomain domains = 1;
}

// Request to warm one image on every node of one domain.
message WarmImageRequest {
  // Rootfs image, pinned by digest (repo@sha256:...). Required.
  string rootfs_image = 1;
  // Base ActorTemplate the derived template comes from; defaults as in
  // CreateEnvironmentRequest.template.
  Template template = 2;
  // Atespace of the probes and the templates (defaults as in
  // CreateEnvironmentRequest).
  string atespace = 3;
  // The domain: a worker selector as CreateEnvironmentRequest.worker_selector,
  // which Substrate ANDs with the template's own. Empty means the template's
  // own pools.
  map<string, string> worker_selector = 4;
  // Nodes to cover. 0 means the distinct nodes of the schedulable workers
  // the selector matches, which takes ListPlacementDomains's permission. A
  // value above that count is InvalidArgument when the server can list the
  // workers; without that permission the value is trusted. nodes x
  // probes_per_node is at most 256 per round. A selector that sets a key
  // of the template's selector to another value is FailedPrecondition: no
  // worker carries both.
  int32 nodes = 5;
  // Probes a round starts per node; the round holds them until all are
  // RUNNING, so the scheduler spreads them. Default 2, at most 8, and at
  // most the server's -warm-max-probes-per-node (2 unless raised), which
  // refuses more with InvalidArgument.
  int32 probes_per_node = 6;
  // Rounds before the call gives up. Default 3, at most 10.
  int32 max_rounds = 7;
  // Bound on one probe's create and start; positive when set. Default 10
  // minutes.
  google.protobuf.Duration probe_timeout = 8;
  // Prefix of the probe environment names ([a-z0-9-], at most 20
  // characters), unique per call: a probe name that exists already is
  // another call's or a user's and is left alone. Default "warm-" and a
  // random suffix.
  string run_id = 9;
}

// One probe of a WarmImage call, or its final coverage.
message WarmImageEvent {
  oneof event {
    WarmProbe probe = 1;
    WarmImageCoverage coverage = 2;
  }
}

// One probe environment: created, RUNNING or failed, node read, deleted.
message WarmProbe {
  string id = 1;
  // Node the probe ran on; "" when it failed before placement.
  string node = 2;
  int32 round = 3;
  google.protobuf.Duration duration = 4;
  // Why the probe failed; "" on success.
  string error = 5;
}

// What a WarmImage call covered.
message WarmImageCoverage {
  // Nodes the image ran on, sorted.
  repeated string nodes = 1;
  // Nodes the call set out to cover.
  int32 wanted = 2;
  int32 probes = 3;
  int32 failed = 4;
  int32 rounds = 5;
  // True when the nodes reached wanted.
  bool complete = 6;
  // The last probe error when the call stopped short.
  string error = 7;
  // Probes the call could not delete: the delete failed after its retries,
  // or the actor ended CRASHED, which Substrate cannot delete today. Each is
  // an environment id in the request's atespace, for the caller to sweep
  // (DeleteEnvironment) once the control plane takes the delete.
  repeated string undeleted_probes = 8;
  // Time the rounds waited for probe slots on the worker selector, held by
  // other WarmImage calls: the server caps the probes in flight per node
  // (ate-env-api -warm-max-probes-per-node) across calls.
  google.protobuf.Duration waited = 9;
}
